edition: 2.0.0
name: resume-analysis
access: default

services:
  resume-analysis:
    component: devsapp/fc
    props:
      region: cn-shanghai
      service:
        name: resume-analysis-service
      function:
        name: resume-api
        runtime: python3.10
        memorySize: 1024
        timeout: 120
        handler: src.main_pure.handler
        codeUri: ./
        instanceType: e1
        environmentVariables:
          DASHSCOPE_API_KEY: sk-c3c62b663de04038b76d2f444efbc979
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - POST
              - GET
      actions:
        pre-deploy:
          - run: pip install -t src/ --no-deps -r requirements.txt
            path: ./
