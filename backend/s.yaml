edition: 2.0.0
name: resume-analysis
access: default

services:
  resume-analysis:
    component: devsapp/fc
    props:
      region: cn-shanghai
      service:
        name: resume-analysis-service
        description: Resume Analysis Service
      function:
        name: resume-api
        runtime: python3.10
        memorySize: 512
        timeout: 60
        handler: src.main.handler
        codeUri: ./
        environmentVariables:
          DASHSCOPE_API_KEY: sk-c3c62b663de04038b76d2f444efbc979
        pip:
          - flask
          - flask-cors
          - werkzeug
          - dashscope
          - pdfplumber
          - redis
          - PyJWT
          - python-multipart
          - python-dotenv
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - POST
              - GET
