edition: 2.0.0
name: resume-analysis
access: default

services:
  resume-analysis:
    component: devsapp/fc
    props:
      region: cn-shanghai
      service:
        name: resume-analysis-service
        description: Resume Analysis Service
      function:
        name: resume-api
        runtime: python3.10
        memorySize: 512
        timeout: 60
        handler: src.main.handler
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - POST
              - GET
